name: Trunk checks

# What pre-push refuses, checked again for every push to main: a push made
# with --no-verify, or from a clone whose hooks never ran, lands here too.
on:
  push:
    branches: [main]

jobs:
  trunk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # >>> review receipt
      - name: Review receipt
        run: |
          ref="refs/reviews/$GITHUB_SHA"
          found=$(git ls-remote origin "$ref" | awk -v ref="$ref" '$2 == ref { print $1 }')
          if [ "$found" = "$GITHUB_SHA" ]; then
            echo "reviewed: $GITHUB_SHA"
          else
            echo "::error::$GITHUB_SHA reached main with no review receipt (refs/reviews/$GITHUB_SHA)."
            echo "Review it, then record the review and push it with the commit:"
            echo '  git update-ref "refs/reviews/$(git rev-parse HEAD)" HEAD'
            echo '  git push --atomic origin HEAD "refs/reviews/$(git rev-parse HEAD)"'
            echo "A receipt pushed on its own starts no run: re-run this job once it is pushed."
            exit 1
          fi
      # <<< review receipt

      # commit-msg lets fixup!/squash!/amend! through for --autosquash; they
      # must be folded away before they reach main.
      - name: No unsquashed fixups
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          range="$GITHUB_SHA"
          case $BEFORE in *[!0]*)
            # A force-push leaves the old tip on no ref, so it is not fetched:
            # check the whole history then, rather than a range that can
            # never resolve.
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              range="$BEFORE..$GITHUB_SHA"
            else
              echo "::warning::$BEFORE is not fetched (a force-push?); checking all of $GITHUB_SHA's history."
            fi ;;
          esac
          # Separately, so a git failure fails the step instead of passing it
          # unchecked.
          if ! log=$(git log --format='%h %s' "$range"); then
            echo "::error::git could not list $range, so this push was not checked for fixup commits."
            exit 1
          fi
          if found=$(printf '%s\n' "$log" | grep -E '^[0-9a-f]+ (fixup|squash|amend)! '); then
            echo "::error::unsquashed fixup commits reached main:"
            printf '%s\n' "$found"
            exit 1
          fi
