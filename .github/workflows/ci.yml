name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        # The lint tests are the local gate's, run with the tools CLAUDE.md
        # vouches for; the runner's unpinned clang tools are not those.
        run: ctest --test-dir build --output-on-failure -LE lint
